name: Bug 报告
description: 报告可复现的软件、硬件或集成问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明期望行为与实际行为。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 机器人、分支/提交、ROS/系统版本、硬件版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与补充信息
      description: 请先移除 token、密码、个人信息和内部网络信息。
